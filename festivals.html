    .card { background-color: white; color: black; transition: transform 0.3s ease, box-shadow 0.3s ease; }

  </style>

  <div class="fixed-top bg-orange-500 shadow-md" style="background-color: #ff7f00;">

        <a href="map.html" class="text-dark text-decoration-none">Map</a>

        <a href="geographic.html" class="text-dark text-decoration-none">Geography</a>

        <a href="festivals.html" class="text-dark text-decoration-none">Festival</a>
        <a href="art.html" class="text-dark text-decoration-none">Art</a>
        <a href="newsletter.html" class="btn btn-outline-light">Join Newletter</a>
      </nav>
    </div>
  </div>

  <div class="container mt-5">
    <div class="row row-cols-1 row-cols-md-3 g-4">
      <!-- Festival Cards Will Be Injected Here -->
    </div>

    $(document).ready(function() {
      $('.row').hide().fadeIn(1500);

    ;
