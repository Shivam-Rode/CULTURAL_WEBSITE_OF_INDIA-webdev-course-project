<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geographic Sites in India</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
        }
        
        .header1 { position: fixed; top: 0; left: 0; width: 100%; background-color: #F97316; padding: 20px; box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3); z-index: 50; }
      .header-content1 { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
      .header img{ height: 40px; }
      nav a { color: black; font-size: 16px; padding: 8px 16px; text-decoration: none; transition: color 0.3s; }
      nav a:hover { color: white; }

        h1 {
            margin: 0px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            justify-content: center;
        }
        .card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }
        .card h2 {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px;
            margin: 0;
            font-size: 1.5em;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header1">
        <div class="header-content1">
          <img src="logo.png" alt="Logo">
          <h1>Geographic Sites</h1>
          <nav>
            <a href="map.html" target="_blank">Map</a>
            <a href="/b.html" target="_blank">Heritage Site</a>
            <a href="geographic.html">Geography</a>
            <a href="religion.html">Religion</a>
            <a href="festivals.html">Festival</a>
            <a href="art.html" target="_blank">Art</a>
            <a href="newsletter.html" class="sign-in">Join newsletter</a>

          </nav>
        </div>
      </div >

    <div id="regions" style="margin-top: 130px;"  class="grid mt-20"></div>

    <script>
            
            $(document).ready(function () {
        var regions = [
            { name: "Forts", image: "pratapgad.jpg", link: "fortgallery.html", },
            { name: "Thar Desert", image: "Thar Desert.jpg", link: "thar-desert.html" },
            { name: "Himalayas", image: "himalayas.jpg", link: "himalayas.html" },
            { name: "Andaman & Nicobar", image: "Andaman Nicobar.jpg", link: "andamannicobar.html" },
            { name: "Sundarbans", image: "Sundarban.jpg", link: "sundarban.html" },
            { name: "Taj Mahal", image: "Tajmahal.jpg", link: "taj-mahal.html" },
            { name: "Golden Temple", image: "Golden temple.jpg", link: "golden-temple.html" },
            { name: "Red Fort", image: "redfort.jpg", link: "red-fort.html" },
            { name: "Lonar Lake", image: "lonarlake.jpg", link: "lonar-lake.html" },
            { name: "Rann of Kutch", image: "rannofkutch.jpg", link: "rann-of-kutch.html" }
        ];


        $.each(regions, function (index, region) {              // $.each() is a jQuery function that loops through the regions array.     
                                                                    // index is the current index in the loop      
                                                                    // region represents the current object in the array.
                $("#regions").append(                                //$("#regions").append(...); selects the HTML element with the 
                                                                    // ID regions and appends a dynamically created card to it.
                    `<div class="card">
                        <a href="${region.link}">
                            <img src="${region.image}" alt="${region.name}">                
                            <h2>${region.name}</h2>
                        </a>
                    </div>`
                );
            });
        });
    </script>

</body>
</html>
