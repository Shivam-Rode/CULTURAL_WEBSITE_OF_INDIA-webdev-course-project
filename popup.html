<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-up Message</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .popup {
            position: fixed;
            right: 20px;
            bottom: 50px;
            background-color: #fff;
            border: 2px solid #000;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            max-width: 250px;
            transition: opacity 0.3s ease-in-out;
        }
        .popup img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .popup .message {
            font-size: 14px;
        }
        .popup.hide {
            display: none;
        }
    </style>
</head>
<body>
    <div class="popup" id="popup">
        <img id="popup-img" src="https://cdn-icons-png.flaticon.com/512/1995/1995574.png" alt="Indian Man">
        <div class="message" id="popup-message">Hey! Try hovering your mouse over those dots and witness the magic.</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const popup = document.getElementById('popup');
            const popupMessage = document.getElementById('popup-message');
            const popupImg = document.getElementById('popup-img');
            
            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('mouseover', () => {
                    popupMessage.textContent = "Good! Explore the UNESCO sites in India";
                    popupImg.src = "https://cdn-icons-png.flaticon.com/512/271/271239.png"; 
                });
                dot.addEventListener('mouseout', () => {
                    popupMessage.textContent = "Hey! Try hovering your mouse over those dots and witness the magic.";
                    popupImg.src = "https://cdn-icons-png.flaticon.com/512/1995/1995574.png"; 
                });
            });
        });
    </script>
</body>
</html>
